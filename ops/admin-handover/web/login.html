<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · ICU教学平台</title><link rel="stylesheet" href="/handover/assets/user-import.css"><script src="/handover/assets/branding.js" defer></script><script src="/handover/assets/access.js" defer></script></head>
<body data-page="login" class="auth-page"><div class="auth-layout"><div class="auth-form-panel"><div class="auth-top"><a class="brand" href="/"><img data-org-logo src="/content/orgs/org_32e55dad-43ad-4eb4-ac0d-ecd1af125ddc/logos/48215d64-e8ce-405b-beb3-bf6801b019a0_logo.png" alt="ICU"><span data-org-name>省医院ICU教学平台</span></a><a href="/">返回首页</a></div><main class="login-main"><h1>欢迎回来</h1><p class="auth-subtitle">输入用户名或已绑定邮箱，访问您的账户。</p>

<form id="mfa-form" hidden><label>双重验证或备用代码<input id="mfa-code" type="text" autocomplete="one-time-code" required></label><label class="confirm"><input id="backup-code" type="checkbox">使用备用代码</label><button type="submit">验证并登录</button><p class="login-links"><a href="/login">重新登录</a></p></form><p id="status" role="status" aria-live="polite"></p>
