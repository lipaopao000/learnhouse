<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SBAR交接班练习器</title><style>*{box-sizing:border-box}body{margin:0;background:#fafafa;color:#18181b;font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:960px;margin:auto;padding:28px}small,.muted{color:#71717a}.tag{display:inline-block;background:#f0fdfa;color:#0f766e;border-radius:8px;padding:4px 10px;font-size:12px}h1{font-size:28px;line-height:1.3;margin:16px 0 10px}h2{font-size:18px}p{margin:8px 0 16px}.notice{padding:14px 16px;border:1px solid #e4e4e7;border-radius:12px;background:white;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:22px 0}label{display:block;font-weight:600}label small{display:block;font-weight:400;margin:4px 0 7px}textarea{width:100%;min-height:100px;border:1px solid #d4d4d8;border-radius:10px;padding:12px;font:inherit;background:white;resize:vertical}textarea:focus,button:focus-visible{outline:2px solid #0f766e;outline-offset:2px}button{border:1px solid #d4d4d8;border-radius:10px;padding:10px 16px;background:white;color:#18181b;font:inherit;cursor:pointer;margin:0 8px 10px 0}button.primary{background:#18181b;color:white;border-color:#18181b}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;background:white;border:1px solid #e4e4e7;border-radius:12px;padding:18px;min-height:120px}#status{min-height:24px;color:#0f766e;font-size:13px}@media(max-width:650px){main{padding:18px}.grid{grid-template-columns:1fr}h1{font-size:24px}}</style></head><body><main><span class="tag">ICU 教学示例 · 本地练习</span><h1>SBAR交接班练习器</h1><p class="muted">把一段交班整理成四个清楚的部分。先填写虚构内容，再生成练习稿。</p><div class="notice">教学示例：病例与数值均为虚构，仅用于表达、记录和讨论练习；不构成院内诊疗规范。请勿填写真实姓名、住院号或上传未脱敏资料。<br>输入只在当前页面内处理；不上传、不持久保存。关闭页面后请自行保存需要保留的虚构练习稿。</div><div class="grid"><label for="f0">S｜现状<small>当前问题、观察时间、交接对象</small><textarea id="f0" placeholder="只填写虚构或合规脱敏的教学内容"></textarea></label><label for="f1">B｜背景<small>入科原因、已有支持、信息来源</small><textarea id="f1" placeholder="只填写虚构或合规脱敏的教学内容"></textarea></label><label for="f2">A｜评估与缺口<small>客观观察、趋势、自己的判断与尚缺资料</small><textarea id="f2" placeholder="只填写虚构或合规脱敏的教学内容"></textarea></label><label for="f3">R｜请求与闭环<small>希望谁、何时完成什么；接收确认与复评</small><textarea id="f3" placeholder="只填写虚构或合规脱敏的教学内容"></textarea></label></div><button class="primary" id="generate">生成练习稿</button><button id="example">填入虚构示例</button><button id="clear">清空</button><h2>练习稿</h2><pre id="output">在上方填写后点击“生成练习稿”。</pre><button id="copy">复制练习稿</button><p id="status" role="status" aria-live="polite"></p><small>v1.0 · 由带教老师组织反馈，不设自动评分或诊疗处方。</small></main><script>const labels=["S｜现状", "B｜背景", "A｜评估与缺口", "R｜请求与闭环"],example=["病例 A，08:00 呼吸频率 30 次/分，较 07:00 增快，向带教老师汇报。", "虚构病例因呼吸困难入科；有氧疗记录，但设备和流量尚需核对。", "已有呼吸频率变化；尚缺同期 SpO2、意识、呼吸做功及氧疗条件，暂不能确定原因。", "请带教老师床旁共同评估；轮转医师补齐同期资料，护士反馈监测与设备情况，交接双方复述任务。"];const inputs=labels.map((_,i)=>document.getElementById('f'+i));const out=document.getElementById('output'),status=document.getElementById('status');function generate(){out.textContent='教学练习稿（非诊疗建议）\n\n'+labels.map((l,i)=>l+'\n'+(inputs[i].value.trim()||'【未填写：请补齐或注明未知】')).join('\n\n');status.textContent='已生成。请核对事实、来源、时间与信息缺口。'}document.getElementById('generate').onclick=generate;document.getElementById('example').onclick=()=>{inputs.forEach((e,i)=>e.value=example[i]);generate()};document.getElementById('clear').onclick=()=>{inputs.forEach(e=>e.value='');out.textContent='在上方填写后点击“生成练习稿”。';status.textContent='已清空本页内容。'};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(out.textContent);status.textContent='已复制。'}catch(e){const r=document.createRange();r.selectNodeContents(out);const s=window.getSelection();s.removeAllRanges();s.addRange(r);status.textContent='浏览器限制了剪贴板，已选中全文，可手动复制。'}};</script></body></html>
