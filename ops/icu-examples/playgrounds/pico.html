<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PICO文献阅读卡</title><style>*{box-sizing:border-box}body{margin:0;background:#fafafa;color:#18181b;font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:960px;margin:auto;padding:28px}small,.muted{color:#71717a}.tag{display:inline-block;background:#f0fdfa;color:#0f766e;border-radius:8px;padding:4px 10px;font-size:12px}h1{font-size:28px;line-height:1.3;margin:16px 0 10px}h2{font-size:18px}p{margin:8px 0 16px}.notice{padding:14px 16px;border:1px solid #e4e4e7;border-radius:12px;background:white;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:22px 0}label{display:block;font-weight:600}label small{display:block;font-weight:400;margin:4px 0 7px}textarea{width:100%;min-height:100px;border:1px solid #d4d4d8;border-radius:10px;padding:12px;font:inherit;background:white;resize:vertical}textarea:focus,button:focus-visible{outline:2px solid #0f766e;outline-offset:2px}button{border:1px solid #d4d4d8;border-radius:10px;padding:10px 16px;background:white;color:#18181b;font:inherit;cursor:pointer;margin:0 8px 10px 0}button.primary{background:#18181b;color:white;border-color:#18181b}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;background:white;border:1px solid #e4e4e7;border-radius:12px;padding:18px;min-height:120px}#status{min-height:24px;color:#0f766e;font-size:13px}@media(max-width:650px){main{padding:18px}.grid{grid-template-columns:1fr}h1{font-size:24px}}</style></head><body><main><span class="tag">ICU 教学示例 · 本地练习</span><h1>PICO文献阅读卡</h1><p class="muted">先写清问题，再记录来源、结果和局限。这里不会自动检索或生成研究结论。</p><div class="notice">教学示例：病例与数值均为虚构，仅用于表达、记录和讨论练习；不构成院内诊疗规范。请勿填写真实姓名、住院号或上传未脱敏资料。<br>输入只在当前页面内处理；不上传、不持久保存。关闭页面后请自行保存需要保留的虚构练习稿。</div><div class="grid"><label for="f0">P｜人群或问题<small>对象、背景、纳排条件</small><textarea id="f0" placeholder="只填写虚构或合规脱敏的教学内容"></textarea></label><label for="f1">I｜干预或暴露<small>希望研究的措施</small><textarea id="f1" placeholder="只填写虚构或合规脱敏的教学内容"></textarea></label><label for="f2">C｜对照<small>比较条件</small><textarea id="f2" placeholder="只填写虚构或合规脱敏的教学内容"></textarea></label><label for="f3">O｜结局<small>关注结局与观察时长</small><textarea id="f3" placeholder="只填写虚构或合规脱敏的教学内容"></textarea></label><label for="f4">原始来源与结果<small>题名、作者、年份、DOI/官网；数据与不确定性</small><textarea id="f4" placeholder="只填写虚构或合规脱敏的教学内容"></textarea></label><label for="f5">局限与本地适用性<small>偏倚、外推限制、与本地制度的关系</small><textarea id="f5" placeholder="只填写虚构或合规脱敏的教学内容"></textarea></label></div><button class="primary" id="generate">生成练习稿</button><button id="example">填入虚构示例</button><button id="clear">清空</button><h2>练习稿</h2><pre id="output">在上方填写后点击“生成练习稿”。</pre><button id="copy">复制练习稿</button><p id="status" role="status" aria-live="polite"></p><small>v1.0 · 由带教老师组织反馈，不设自动评分或诊疗处方。</small></main><script>const labels=["P｜人群或问题", "I｜干预或暴露", "C｜对照", "O｜结局", "原始来源与结果", "局限与本地适用性"],example=["ICU 轮转医师。", "结构化 SBAR 交接培训。", "常规入科介绍。", "情景演练中的关键要素完整性。", "学习入口：AHRQ TeamSTEPPS SBAR。尚未纳入原始研究，无效果数据，不能得出培训有效的结论。", "后续需检索原始研究并核对设计、人群和测量工具；科室培训评价需结合实际工作。"];const inputs=labels.map((_,i)=>document.getElementById('f'+i));const out=document.getElementById('output'),status=document.getElementById('status');function generate(){out.textContent='教学练习稿（非诊疗建议）\n\n'+labels.map((l,i)=>l+'\n'+(inputs[i].value.trim()||'【未填写：请补齐或注明未知】')).join('\n\n');status.textContent='已生成。请核对事实、来源、时间与信息缺口。'}document.getElementById('generate').onclick=generate;document.getElementById('example').onclick=()=>{inputs.forEach((e,i)=>e.value=example[i]);generate()};document.getElementById('clear').onclick=()=>{inputs.forEach(e=>e.value='');out.textContent='在上方填写后点击“生成练习稿”。';status.textContent='已清空本页内容。'};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(out.textContent);status.textContent='已复制。'}catch(e){const r=document.createRange();r.selectNodeContents(out);const s=window.getSelection();s.removeAllRanges();s.addRange(r);status.textContent='浏览器限制了剪贴板，已选中全文，可手动复制。'}};</script></body></html>
