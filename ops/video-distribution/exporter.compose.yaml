services:
  video-exporter:
    image: local/learnhouse:20261105-email-verification-v2
    container_name: learnhouse-video-exporter
    entrypoint: ["/app/api/.venv/bin/python", "/opt/exporter.py"]
    working_dir: /tmp
    restart: unless-stopped
    read_only: true
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - /mnt/d/deploy/LearnHouseVideoExport/exporter.py:/opt/exporter.py:ro
      - /mnt/d/deploy/LearnHouseVideoExport/exporter.private.json:/run/config/exporter.private.json:ro
      - /mnt/d/deploy/LearnHouse/content:/content:ro
    tmpfs:
      - /tmp:size=16m
    networks:
      - learnhouse
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "/app/api/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8817/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  learnhouse:
    external: true
    name: learnhouse_default
