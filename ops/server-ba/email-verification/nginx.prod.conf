server {
 listen 80;
 server_name _;
 client_max_body_size 6G;
 large_client_header_buffers 4 32k;
 location ^~ /__learnhouse_export/ {
  resolver 127.0.0.11 valid=30s;
  set $video_exporter "learnhouse-video-exporter:8817";
  rewrite ^/__learnhouse_export/(.*)$ /$1 break;
  proxy_pass http://$video_exporter$uri$is_args$args;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header X-LearnHouse-Origin-Key $http_x_learnhouse_origin_key;
  proxy_buffering off;
  proxy_read_timeout 60s;
 }
 location / {
  proxy_pass http://app:80;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_read_timeout 86400s;
  proxy_send_timeout 86400s;
 }
}
